<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title th:text="${task.id == null}
            ? 'Create Task | TaskTrack'
            : 'Edit Task | TaskTrack'">

        TaskTrack

    </title>


    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">


    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
            rel="stylesheet">


    <style>

        body {

            background: #f3f6fb;

            color: #172033;

            font-family:
                    Inter,
                    Arial,
                    sans-serif;

        }


        .main-container {

            max-width: 760px;

        }


        .brand {

            font-weight: 800;

        }


        .top-header {

            background:
                    linear-gradient(
                            135deg,
                            #111827,
                            #1d4ed8
                    );

            color: white;

            padding: 28px;

            border-radius: 22px;

            box-shadow:
                    0 12px 30px
                    rgba(0,0,0,.12);

        }


        .header-subtitle {

            color: #dbeafe;

        }


        .form-card {

            border: none;

            border-radius: 22px;

            box-shadow:
                    0 10px 32px
                    rgba(0,0,0,.07);

        }


        .form-icon {

            width: 54px;

            height: 54px;

            border-radius: 16px;

            background: #eef3ff;

            color: #2563eb;

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 23px;

        }


        .form-control,
        .form-select {

            min-height: 48px;

            border-radius: 11px;

            border-color: #d8dee8;

        }


        textarea.form-control {

            min-height: 120px;

        }


        .form-control:focus,
        .form-select:focus {

            border-color: #2563eb;

            box-shadow:
                    0 0 0
                    .2rem
                    rgba(37,99,235,.10);

        }


        .form-label {

            font-weight: 650;

            font-size: 14px;

        }


        .required {

            color: #dc3545;

        }


        .mode-badge {

            border-radius: 20px;

            padding: 7px 12px;

            font-size: 12px;

            font-weight: 700;

        }

    </style>

</head>


<body>


<div class="container main-container py-4">


    <!-- ================================= -->
    <!-- HEADER -->
    <!-- ================================= -->


    <div class="top-header mb-4">


        <div class="d-flex
                    flex-wrap
                    justify-content-between
                    align-items-center
                    gap-3">


            <div>


                <h2 class="brand mb-1">

                    <i class="bi bi-check2-square"></i>

                    TaskTrack

                </h2>


                <div class="header-subtitle">

                    Smart Task Management System

                </div>


            </div>


            <a
                    href="/"
                    class="btn btn-light">


                <i class="bi bi-arrow-left"></i>

                Dashboard


            </a>


        </div>


    </div>



    <!-- ================================= -->
    <!-- FORM CARD -->
    <!-- ================================= -->


    <div class="card form-card">


        <div class="card-body p-4 p-md-5">


            <!-- FORM TITLE -->


            <div class="d-flex
                        justify-content-between
                        align-items-start
                        gap-3
                        mb-4">


                <div class="d-flex
                            align-items-center
                            gap-3">


                    <div class="form-icon">


                        <i
                                th:if="${task.id == null}"
                                class="bi bi-plus-lg">

                        </i>


                        <i
                                th:unless="${task.id == null}"
                                class="bi bi-pencil-square">

                        </i>


                    </div>



                    <div>


                        <!-- CREATE TITLE -->


                        <h3
                                th:if="${task.id == null}"
                                class="fw-bold mb-1">

                            Create New Task

                        </h3>


                        <!-- EDIT TITLE -->


                        <h3
                                th:unless="${task.id == null}"
                                class="fw-bold mb-1">

                            Edit Task

                        </h3>



                        <div
                                th:if="${task.id == null}"
                                class="text-muted">

                            Add a new task to your dashboard.

                        </div>


                        <div
                                th:unless="${task.id == null}"
                                class="text-muted">

                            Update the information
                            for this task.

                        </div>


                    </div>


                </div>



                <!-- MODE BADGE -->


                <span
                        th:if="${task.id == null}"
                        class="mode-badge
                               bg-primary-subtle
                               text-primary">

                    NEW

                </span>


                <span
                        th:unless="${task.id == null}"
                        class="mode-badge
                               bg-warning-subtle
                               text-warning-emphasis">

                    EDITING

                </span>


            </div>



            <!-- ================================= -->
            <!-- FORM -->
            <!-- ================================= -->


            <form
                    th:action="@{/save}"
                    th:object="${task}"
                    method="post">



                <!-- ================================= -->
                <!-- ID -->
                <!--
                    Only sent while EDITING.
                    New task receives MongoDB ID.
                -->
                <!-- ================================= -->


                <input
                        th:if="${task.id != null}"
                        type="hidden"
                        th:field="*{id}">



                <!-- ================================= -->
                <!-- TITLE -->
                <!-- ================================= -->


                <div class="mb-3">


                    <label class="form-label">

                        Task Title

                        <span class="required">*</span>

                    </label>


                    <input
                            type="text"
                            class="form-control"
                            th:field="*{title}"
                            placeholder="Enter task title"
                            maxlength="100"
                            required>


                </div>



                <!-- ================================= -->
                <!-- DESCRIPTION -->
                <!-- ================================= -->


                <div class="mb-3">


                    <label class="form-label">

                        Description

                        <span class="required">*</span>

                    </label>


                    <textarea
                            class="form-control"
                            th:field="*{description}"
                            placeholder="Describe your task..."
                            maxlength="500"
                            required></textarea>


                </div>



                <!-- ================================= -->
                <!-- PRIORITY + STATUS -->
                <!-- ================================= -->


                <div class="row">


                    <!-- PRIORITY -->


                    <div class="col-md-6 mb-3">


                        <label class="form-label">

                            Priority

                        </label>


                        <select
                                class="form-select"
                                th:field="*{priority}"
                                required>


                            <option value="Low">

                                Low

                            </option>


                            <option value="Medium">

                                Medium

                            </option>


                            <option value="High">

                                High

                            </option>


                        </select>


                    </div>



                    <!-- STATUS -->


                    <div class="col-md-6 mb-4">


                        <label class="form-label">

                            Status

                        </label>


                        <select
                                class="form-select"
                                th:field="*{status}"
                                required>


                            <option value="Pending">

                                Pending

                            </option>


                            <option value="In Progress">

                                In Progress

                            </option>


                            <option value="Completed">

                                Completed

                            </option>


                        </select>


                    </div>


                </div>



                <!-- ================================= -->
                <!-- BUTTONS -->
                <!-- ================================= -->


                <div class="d-flex
                            flex-wrap
                            gap-2">


                    <!-- CREATE BUTTON -->


                    <button
                            th:if="${task.id == null}"
                            type="submit"
                            class="btn
                                   btn-primary
                                   px-4">


                        <i class="bi bi-plus-lg"></i>

                        Create Task


                    </button>



                    <!-- EDIT BUTTON -->


                    <button
                            th:unless="${task.id == null}"
                            type="submit"
                            class="btn
                                   btn-success
                                   px-4">


                        <i class="bi bi-check2"></i>

                        Save Changes


                    </button>



                    <!-- CANCEL -->


                    <a
                            href="/"
                            class="btn
                                   btn-light
                                   border
                                   px-4">


                        Cancel


                    </a>


                </div>


            </form>


        </div>


    </div>


</div>


</body>

</html>
